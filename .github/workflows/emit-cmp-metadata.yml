name: Emit CMP_LIBRARY_METADATA.gradle

# Reusable workflow — emit a Gradle properties file with per-cmp-* version + artifact constants.
# Authored 2026-05-30 by library-runtime-observability epic Phase 02 T1 (AC #9).
#
# Caller: library repos' publish.yml after publish-step succeeds.
# Output: CMP_LIBRARY_METADATA.gradle artifact attached to the workflow run.
#
# Consumed by per-cmp-* CmpMetadataGenTask (Phase 02 T3) which reads these `extra["..."]`
# properties at compile time to generate commonMain/.../CmpMetadata.kt.

on:
  workflow_call:
    inputs:
      module_pattern:
        description: 'Module directory glob (e.g. cmp-*, cmp-worker-*)'
        type: string
        default: 'cmp-*'
      output_path:
        description: 'Repo-relative path for the generated Gradle file'
        type: string
        default: 'CMP_LIBRARY_METADATA.gradle'
      version_property_key:
        description: 'Gradle property holding the library version (e.g. kmptoolkit.version)'
        type: string
        default: 'kmptoolkit.version'

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan + emit metadata
        run: |
          set -euo pipefail
          OUT="${{ inputs.output_path }}"
          VERSION_KEY="${{ inputs.version_property_key }}"
          PATTERN="${{ inputs.module_pattern }}"

          # Resolve umbrella version from gradle.properties
          UMBRELLA_VERSION="$(grep -E "^${VERSION_KEY}=" gradle.properties | head -1 | cut -d= -f2)"

          {
            echo "// Auto-generated by mbl-actionhub emit-cmp-metadata.yml — $(date -u +%FT%TZ)"
            echo "// DO NOT HAND-EDIT. Regenerated post-publish per library-runtime-observability epic AC #9."
            echo ""
          } > "$OUT"

          mod_count=0
          for mod_dir in ${PATTERN}/; do
            [[ -d "$mod_dir" ]] || continue
            module="${mod_dir%/}"
            # Try module-local mavenPublishVersion override; fall back to umbrella version.
            version="$( (grep -oE 'mavenPublishVersion\s*=\s*"[^"]+"' "$mod_dir/build.gradle.kts" 2>/dev/null || true) | head -1 | sed -nE 's/.*"([^"]+)".*/\1/p')"
            [[ -z "$version" ]] && version="$UMBRELLA_VERSION"
            [[ -z "$version" ]] && continue

            # Convert module name to Gradle property key: cmp-share → cmp_share
            key="$(echo "$module" | tr '-' '_')"
            echo "extra[\"${key}_version\"] = \"${version}\"" >> "$OUT"
            echo "extra[\"${key}_artifact\"] = \"io.github.mobilebytelabs:${module}\"" >> "$OUT"
            mod_count=$((mod_count + 1))
          done
          echo ""
          echo "Generated $OUT with ${mod_count} module(s); $(grep -c '^extra' "$OUT") property entries."

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmp-library-metadata
          path: ${{ inputs.output_path }}
          retention-days: 90
