name: Sync docs to Wiki

# Reusable workflow — mirrors a caller repo's docs/ to its GitHub Wiki with
# collision-safe link rewriting + auto-generated _Sidebar.md.
#
# Why it exists
# -------------
# GitHub Wiki indexes every .md file by **basename only** — subdirectory context
# is dropped when an action mirrors a nested docs/ tree. Relative links like
# `[text](sub-dir/file.md)` break: 404 → raw.githubusercontent.com fallback OR
# silent redirect to wiki Home. The bundled rewriter (.github/scripts/rewrite-
# wiki-links.py) detects this + handles basename collisions by subdir-prefixing
# the slug, then auto-generates _Sidebar.md grouped by source subdir.
#
# Caller bootstrap (one-time, in the consumer's GitHub UI):
#   1. Settings → Features → Wikis (enable checkbox)
#   2. Wiki tab → "Create the first page" → save anything ("Home", "TBD"). This
#      initializes the underlying `{repo}.wiki.git` repo. Without it the
#      Andrew-Chen-Wang/github-wiki-action@v4 step below fails with
#      "Repository not found".
#
# Caller usage
# ------------
#   # .github/workflows/sync-docs-to-wiki.yml in YOUR repo:
#   name: Sync docs to Wiki
#   on:
#     push:
#       branches: [development]
#       paths: ['docs/**']
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     sync:
#       uses: MobileByteLabs/mbl-actionhub/.github/workflows/sync-docs-to-wiki.yml@v1.8.0
#
# Authored 2026-06-02 (sync-docs-to-wiki consolidation).
# Tag: v1.8.0+

on:
  workflow_call:
    inputs:
      docs-dir:
        description: 'Source docs directory in the caller repo (relative path)'
        type: string
        default: 'docs'
      sidebar-mode:
        description: 'auto | consumer-authored | none. auto = generate _Sidebar.md if absent; consumer-authored = require docs/_Sidebar.md; none = skip.'
        type: string
        default: 'auto'

permissions:
  contents: write

jobs:
  sync:
    name: Mirror docs/ → wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Checkout mbl-actionhub (for the rewriter script)
        uses: actions/checkout@v4
        with:
          repository: MobileByteLabs/mbl-actionhub
          ref: ${{ github.workflow_sha }}     # pins script to the same commit
                                              # that defines this workflow → caller's
                                              # @tag pin governs the script version too
          path: .mbl-actionhub-tools
          sparse-checkout: |
            .github/scripts/rewrite-wiki-links.py
          sparse-checkout-cone-mode: false

      - name: Rewrite docs/ links → /wiki/ URLs (build .wiki-build/)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SIDEBAR_MODE: ${{ inputs.sidebar-mode }}
        run: |
          python3 .mbl-actionhub-tools/.github/scripts/rewrite-wiki-links.py \
            "${{ inputs.docs-dir }}" .wiki-build

      - name: Smoke test
        run: |
          if [ ! -d .wiki-build ] || [ -z "$(ls -A .wiki-build)" ]; then
            echo "::error::.wiki-build/ missing or empty — script failed silently"
            exit 1
          fi
          if ! grep -rqE "https://github\.com/.+/wiki/[A-Za-z0-9._-]+" .wiki-build/; then
            echo "::warning::No rewritten /wiki/ links found in .wiki-build/. Either docs/ has zero in-tree .md links or the rewriter is broken."
          fi
          if [ "${{ inputs.sidebar-mode }}" = "consumer-authored" ] && [ ! -f .wiki-build/_Sidebar.md ]; then
            echo "::error::sidebar-mode=consumer-authored requires docs/_Sidebar.md (not found in .wiki-build/)"
            exit 1
          fi
          echo "Wiki build verified ✓"

      - name: Push .wiki-build/ to wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: .wiki-build
          token: ${{ secrets.GITHUB_TOKEN }}
